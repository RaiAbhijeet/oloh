# Publishes the website to GitHub Pages:
#   main branch -> https://oneloveoneheart.org/       (live site)
#   dev branch  -> https://oneloveoneheart.org/dev/   (preview for the owner)
#
# Runs on every push to main or dev, so both always show their latest state.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Don't publish anything that fails the site checks. (Checked before
      # dev is added below, so the live check doesn't also scan /dev.)
      - name: Check live site
        run: python _site/tests/check_site.py

      - name: Does a dev branch exist?
        id: dev
        run: |
          if git -C _site ls-remote --exit-code --heads origin dev >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out dev (preview) into /dev
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _site/dev

      - name: Check preview site
        if: steps.dev.outputs.exists == 'true'
        run: python _site/dev/tests/check_site.py

      - name: Prepare preview (no indexing, preview banner)
        if: steps.dev.outputs.exists == 'true'
        run: |
          cd _site/dev
          # Only the live site owns the domain, sitemap and robots rules.
          rm -f CNAME sitemap.xml robots.txt
          # Keep search engines away and mark every page as a preview.
          find . -name '*.html' -not -path './.git/*' -exec sed -i \
            -e 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' \
            -e 's|<body\([^>]*\)>|<body\1>\n  <div style="background:#c0392b;color:#fff;text-align:center;padding:6px 12px;font:600 14px/1.4 sans-serif;">VORSCHAU / PREVIEW – noch nicht veröffentlicht · not live yet</div>|' \
            {} +

      - name: Remove files that aren't part of the website
        run: |
          cd _site
          for d in . dev; do
            [ -d "$d" ] || continue
            rm -rf "$d/.git" "$d/.github" "$d/.githooks" "$d/tests" "$d/changes" \
                   "$d/CLAUDE.md" "$d/.gitignore"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
