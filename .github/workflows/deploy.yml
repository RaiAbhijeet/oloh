# Publishes the website to GitHub Pages:
#   main branch -> https://oneloveoneheart.org/       (live site)
#   dev branch  -> https://oneloveoneheart.org/dev/   (preview for the owner)
#
# The live site is only published while the repository variable PUBLISH_LIVE
# is "true" (Settings -> Secrets and variables -> Actions -> Variables).
# Otherwise only /dev/ is published and the main domain returns 404.
#
# Runs on every push to main or dev, so both always show their latest state.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE == 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-main

      - name: Check out dev (preview) if it exists
        id: dev
        run: |
          if git -C src-main ls-remote --exit-code --heads origin dev >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: src-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Don't publish anything that fails the site checks.
      - name: Check live site
        if: env.PUBLISH_LIVE == 'true'
        run: python src-main/tests/check_site.py
      - name: Check preview site
        if: steps.dev.outputs.exists == 'true'
        run: python src-dev/tests/check_site.py

      - name: Assemble site
        run: |
          mkdir _site
          if [ "$PUBLISH_LIVE" = "true" ]; then
            cp -r src-main/. _site/
          else
            echo "PUBLISH_LIVE is not 'true': main domain stays offline, only /dev/ is published."
            # Keep search engines away from everything, including /dev/.
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          fi

          if [ "${{ steps.dev.outputs.exists }}" = "true" ]; then
            cp -r src-dev/. _site/dev/
            cd _site/dev
            # Only the live site owns the domain, sitemap and robots rules.
            rm -f CNAME sitemap.xml robots.txt
            # Keep search engines away and mark every page as a preview.
            find . -name '*.html' -not -path './.git/*' -exec sed -i \
              -e 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' \
              -e 's|<body\([^>]*\)>|<body\1>\n  <div style="background:#c0392b;color:#fff;text-align:center;padding:6px 12px;font:600 14px/1.4 sans-serif;">VORSCHAU / PREVIEW – noch nicht veröffentlicht · not live yet</div>|' \
              {} +
            cd ../..
          fi

          # Remove files that aren't part of the website.
          for d in _site _site/dev; do
            [ -d "$d" ] || continue
            rm -rf "$d/.git" "$d/.github" "$d/.githooks" "$d/tests" "$d/changes" \
                   "$d/CLAUDE.md" "$d/.gitignore"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
